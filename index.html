<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini Game Hub</title><style>body{font-family:Arial;background:#1a2a44;color:#fff;padding:15px}.menu{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:15px}.menu button{background:#fff;color:#1a2a44;border:0;padding:10px 15px;border-radius:10px;font-weight:700}.menu button.active{background:#ffcc00}.game{display:none;background:#fff;color:#1a2a44;max-width:400px;margin:auto;border-radius:20px;padding:20px;text-align:center}.game.active{display:block}.game button{padding:10px 16px;margin:5px;border:0;background:#1a2a44;color:#fff;border-radius:10px}input{padding:12px;width:150px;border:2px solid #1a2a44;border-radius:10px;text-align:center}.best{color:#243b55;background:#eef4ff;padding:8px;border-radius:8px;margin:10px 0}</style></head><body><div class="menu"><button id="m1" class="active" onclick="showG('maths')">Maths</button><button id="m2" onclick="showG('rps')">Rock Paper</button><button id="m3" onclick="showG('quiz')">Quiz</button></div><div id="maths" class="game active"><h2>Maths Questions</h2><h1 id="question"></h1><div class="best">Best: <span id="best">0</span></div><input id="answer" type="number" placeholder="Answer"><button onclick="checkA()">Check</button><p id="message">Good luck!</p><p>Streak: <span id="streak">0</span> Score: <span id="score">0</span></p><button onclick="newQ()">New Game</button></div><div id="rps" class="game"><h2>Rock Paper Scissors</h2><button onclick="play('rock')">🪨 Rock</button><button onclick="play('paper')">📄 Paper</button><button onclick="play('scissors')">✂️ Scissors</button><h3 id="rpsR"></h3><p>You:<span id="us">0</span> Comp:<span id="cs">0</span></p></div><div id="quiz" class="game"><h2>Quiz Game</h2><h3 id="quizQ"></h3><div id="quizOptions"></div><p id="quizMsg"></p><p>Score:<span id="qS">0</span>/<span id="qT">0</span></p><button onclick="nextQuiz()">Next</button></div><script>let a,b,ans,st=0,be=0,sc=0;function newQ(){a=Math.floor(Math.random()*20)+1;b=Math.floor(Math.random()*20)+1;let ops=['+','-','*'];let o=ops[Math.floor(Math.random()*3)];if(o==='+')ans=a+b;if(o==='-')ans=a-b;if(o==='*')ans=a*b;document.getElementById('question').innerText=a+' '+o+' '+b+' =?';document.getElementById('answer').value='';}function checkA(){let v=parseInt(document.getElementById('answer').value);if(v===ans){st++;sc+=10;if(st>be)be=st;document.getElementById('message').innerText='Correct! 🎉';setTimeout(newQ,600);}else{document.getElementById('message').innerText='Wrong! Ans '+ans;st=0;}document.getElementById('streak').innerText=st;document.getElementById('score').innerText=sc;document.getElementById('best').innerText=be;}function showG(g){document.querySelectorAll('.game').forEach(e=>e.classList.remove('active'));document.getElementById(g).classList.add('active');document.querySelectorAll('.menu button').forEach(e=>e.classList.remove('active'));if(g==='maths')document.getElementById('m1').classList.add('active');if(g==='rps')document.getElementById('m2').classList.add('active');if(g==='quiz')document.getElementById('m3').classList.add('active');}let u=0,c=0;function play(p){let ch=['rock','paper','scissors'];let co=ch[Math.floor(Math.random()*3)];let r='Draw!';if(p!==co){if((p==='rock'&&co==='scissors')||(p==='paper'&&co==='rock')||(p==='scissors'&&co==='paper')){r='You Win!';u++;}else{r='You Lose!';c++;}}document.getElementById('rpsR').innerText=p+' vs '+co+' = '+r;document.getElementById('us').innerText=u;document.getElementById('cs').innerText=c;}let qd=[{q:'Pakistan Capital?',o:['Karachi','Lahore','Islamabad'],a:2},{q:'2+2*2?',o:['4','6','8'],a:1},{q:'Largest Planet?',o:['Earth','Jupiter','Mars'],a:1}];let qi=0,qs=0,qt=0;function nextQuiz(){let q=qd[Math.floor(Math.random()*qd.length)];qi=qd.indexOf(q);document.getElementById('quizQ').innerText=q.q;let h='';q.o.forEach((x,i)=>h+='<button onclick="checkQ('+i+')" style="display:block;width:100%;margin:5px 0">'+x+'</button>');document.getElementById('quizOptions').innerHTML=h;}function checkQ(i){qt++;if(i===qd[qi].a){qs++;document.getElementById('quizMsg').innerText='Correct!';}else{document.getElementById('quizMsg').innerText='Wrong!';}document.getElementById('qS').innerText=qs;document.getElementById('qT').innerText=qt;}window.onload=function(){newQ();nextQuiz();};</script></body></html>
