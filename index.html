<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mini Game Hub</title><style>body{background:#0f172a;color:#fff;font-family:sans-serif;text-align:center;margin:0;padding:15px}h1{color:#ffcc00}.card{background:#fff;color:#1a2a44;max-width:400px;margin:20px auto;border-radius:15px;padding:20px}button{background:#1a2a44;color:#fff;border:0;padding:12px 20px;border-radius:10px;margin:5px;font-weight:bold}input,textarea{width:90%;padding:10px;margin:5px;border-radius:8px;border:1px solid #ccc}</style></head><body><h1>🎮 Mini Game Hub</h1><div class="card"><h2>🧮 Maths</h2><p id="q">Click Start</p><input id="ans" type="number"><br><button onclick="newQ()">Start</button><button onclick="check()">Check</button><p id="mScore">Score:0</p><p id="mMsg"></p></div><div class="card"><h2>✊ RPS</h2><button onclick="rps('rock')">Rock</button><button onclick="rps('paper')">Paper</button><button onclick="rps('scissor')">Scissor</button><p id="rMsg"></p><p id="rScore">You:0 Comp:0</p></div><div class="card"><h3>⭐ Review Do</h3><input id="rName" placeholder="Naam"><textarea id="rText" placeholder="Review Likho"></textarea><br><button onclick="addReview()" style="background:#ffcc00;color:#000">Bhejo</button><div id="reviewList" style="text-align:left;margin-top:10px"></div></div><script>let a,b,op,ms=0;function newQ(){a=Math.floor(Math.random()*20)+1;b=Math.floor(Math.random()*10)+1;op=['+','-','*'][Math.floor(Math.random()*3)];document.getElementById('q').innerText=a+' '+op+' '+b+' =?'}function check(){let ans=parseInt(document.getElementById('ans').value);let real=op=='+'?a+b:op=='-'?a-b:a*b;if(ans==real){ms++;document.getElementById('mMsg').innerText='Sahi'}else{document.getElementById('mMsg').innerText='Ghalat '+real}document.getElementById('mScore').innerText='Score:'+ms}let ys=0,cs=0;function rps(u){let c=['rock','paper','scissor'][Math.floor(Math.random()*3)];let m='You:'+u+' Comp:'+c+' ';if(u==c)m+='Draw';else if((u=='rock'&&c=='scissor')||(u=='paper'&&c=='rock')||(u=='scissor'&&c=='paper')){m+='Win';ys++}else{m+='Lose';cs++}document.getElementById('rMsg').innerText=m;document.getElementById('rScore').innerText='You:'+ys+' Comp:'+cs}let reviews=JSON.parse(localStorage.getItem('myReviews')||'[]');function addReview(){let name=document.getElementById('rName').value,text=document.getElementById('rText').value;if(!name||!text){alert('Naam Review likho');return}reviews.push({n:name,t:text});localStorage.setItem('myReviews',JSON.stringify(reviews));showReviews();document.getElementById('rName').value='';document.getElementById('rText').value=''}function showReviews(){let h='';reviews.slice(-10).reverse().forEach(r=>{h+='<p>⭐ <b>'+r.n+'</b>: '+r.t+'</p>'});document.getElementById('reviewList').innerHTML=h||'No review'}showReviews();</script></body></html>
